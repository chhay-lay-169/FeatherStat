name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FeatherStat App & DMG
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FeatherStat-DMG
          path: build/FeatherStat.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/FeatherStat.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
